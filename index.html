<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SJP Quotes">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SJP Quote Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a38;
    --accent: #6c63ff;
    --accent2: #ff6b6b;
    --accent3: #00d4aa;
    --text: #f0f0f8;
    --text2: #8888aa;
    --text3: #5555aa;
    --radius: 16px;
    --radius-sm: 10px;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: calc(var(--safe-top) + 14px) 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.5px;
  }

  .header-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.3px;
  }

  .header-sub {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-radius: 12px;
    padding: 3px;
  }

  .tab {
    flex: 1;
    padding: 7px 10px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  /* ── MAIN CONTENT ── */
  .content {
    padding: 0 0 calc(var(--safe-bottom) + 100px);
    max-width: 480px;
    margin: 0 auto;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SECTION CARDS ── */
  .section-card {
    margin: 16px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: slideUp 0.3s ease both;
  }

  @keyframes slideUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .section-label {
    padding: 12px 16px 10px;
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ── INPUTS ── */
  .field-row {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-child { border-bottom: none; }

  .field {
    flex: 1;
    padding: 13px 16px;
    position: relative;
  }

  .field + .field {
    border-left: 1px solid var(--border);
  }

  .field label {
    display: block;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 4px;
    font-family: var(--font-head);
    font-weight: 600;
  }

  .field input,
  .field select {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    -webkit-appearance: none;
    appearance: none;
  }

  .field select {
    cursor: pointer;
  }

  .field input::placeholder { color: var(--text3); }

  .field input:focus,
  .field select:focus {
    color: white;
  }

  /* number inputs clean */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* ── LIVE PREVIEW ── */
  .preview-card {
    margin: 16px;
    background: linear-gradient(135deg, #13131a 0%, #1a1a2e 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .preview-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .preview-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 16px;
    font-family: var(--font-head);
    font-weight: 600;
  }

  .preview-grid {
    display: grid;
    gap: 10px;
  }

  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .preview-row:last-child { border-bottom: none; }

  .preview-row-label {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-row-label .badge {
    width: 18px; height: 18px;
    border-radius: 5px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
    color: var(--accent);
  }

  .preview-row-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .preview-total {
    margin-top: 12px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .preview-total-label {
    font-family: var(--font-head);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text2);
  }

  .preview-total-value {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── CLIENTS LIST ── */
  .client-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    animation: slideUp 0.3s ease both;
  }

  .client-item:last-child { border-bottom: none; }

  .client-item:active { background: var(--surface2); }

  .client-name {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
  }

  .client-detail {
    font-size: 11px;
    color: var(--text2);
    margin-top: 2px;
  }

  .client-arrow {
    color: var(--text3);
    font-size: 18px;
  }

  .empty-state {
    padding: 48px 24px;
    text-align: center;
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-text {
    color: var(--text3);
    font-size: 13px;
    line-height: 1.6;
  }

  /* ── GENERATE BUTTON ── */
  .generate-section {
    padding: 16px;
    position: sticky;
    bottom: calc(var(--safe-bottom) + 0px);
    background: linear-gradient(to top, var(--bg) 80%, transparent);
    padding-top: 24px;
  }

  .btn-generate {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent) 0%, #9c5cff 100%);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(108,99,255,0.35);
  }

  .btn-generate:active { transform: scale(0.98); opacity: 0.9; }

  .btn-secondary {
    width: 100%;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 10px;
  }

  .btn-secondary:active { background: var(--surface2); }

  /* ── QUOTES HISTORY ── */
  .quote-item {
    margin: 0 16px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideUp 0.3s ease both;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .quote-item:active { border-color: var(--accent); }

  .quote-id {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
  }

  .quote-meta {
    font-size: 11px;
    color: var(--text2);
    margin-top: 3px;
  }

  .quote-amount {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent3);
    text-align: right;
  }

  .quote-date {
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
    text-align: right;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 90px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent3);
    color: #000;
    padding: 12px 20px;
    border-radius: 50px;
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(13,13,20,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0 calc(var(--safe-bottom) + 10px);
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: none;
    color: var(--text3);
  }

  .nav-item.active { color: var(--accent); }

  .nav-icon { font-size: 22px; }

  .nav-label {
    font-family: var(--font-head);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ── HEADER ACTIONS ── */
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    color: var(--text2);
    transition: background 0.15s;
  }

  .icon-btn:active { background: var(--surface2); }

  /* ── ANIMATIONS ── */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .calculating { animation: pulse 1s infinite; }

  /* ── CURRENCY BADGE ── */
  .currency-badge {
    display: inline-block;
    padding: 3px 8px;
    background: rgba(108,99,255,0.15);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 6px;
    font-size: 10px;
    color: var(--accent);
    font-family: var(--font-mono);
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Divider line */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 16px;
  }

  /* Section title inline */
  .page-header {
    padding: 20px 16px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .page-title {
    font-family: var(--font-head);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .page-count {
    font-size: 12px;
    color: var(--text3);
    padding-bottom: 4px;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="header-logo">
    <div class="logo-badge">SJP</div>
    <div>
      <div class="header-title">Quote Generator</div>
      <div class="header-sub">SERGIO JORDAN PROGRAMMERS</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="icon-btn" onclick="clearForm()" title="Clear">🗑️</div>
  </div>
</header>

<!-- MAIN CONTENT -->
<div class="content">

  <!-- ══ PAGE: NEW QUOTE ══ -->
  <div id="page-new" class="panel active">

    <!-- Quote # -->
    <div class="section-card" style="animation-delay:0.05s">
      <div class="section-label"><span class="dot"></span>Quote Info</div>
      <div class="field-row">
        <div class="field">
          <label>Quotation No.</label>
          <input id="quotationNo" placeholder="2026-001" type="text">
        </div>
        <div class="field" style="flex:0.6">
          <label>Currency</label>
          <select id="currency" onchange="updatePreview()">
            <option value="es-MX">MXN</option>
            <option value="en-US">USD</option>
            <option value="en-CA">CAD</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Client -->
    <div class="section-card" style="animation-delay:0.1s">
      <div class="section-label"><span class="dot" style="background:var(--accent2)"></span>Client</div>
      <div class="field-row">
        <div class="field">
          <label>Company</label>
          <input id="client" placeholder="Company name" oninput="loadClient(this.value)" onchange="saveClient()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Contact</label>
          <input id="contactName" placeholder="Full name">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input id="clientEmail" placeholder="contact@company.com" type="email">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Address</label>
          <input id="address" placeholder="Street, City">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Address 2 (optional)</label>
          <input id="address2" placeholder="ZIP, Country">
        </div>
      </div>
    </div>

    <!-- Project -->
    <div class="section-card" style="animation-delay:0.15s">
      <div class="section-label"><span class="dot" style="background:var(--accent3)"></span>Project</div>
      <div class="field-row">
        <div class="field">
          <label>Project Name</label>
          <input id="project" placeholder="e.g. FANUC Robot Programming">
        </div>
      </div>
    </div>

    <!-- Hours -->
    <div class="section-card" style="animation-delay:0.2s">
      <div class="section-label"><span class="dot" style="background:#f59e0b"></span>Hours &amp; Rate</div>
      <div class="field-row">
        <div class="field">
          <label>Regular hrs</label>
          <input id="regular_hours" type="number" placeholder="40" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Rate / hr</label>
          <input id="rate" type="number" placeholder="0.00" oninput="updatePreview()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Overtime hrs <span style="color:var(--text3);font-size:9px">(×1.5)</span></label>
          <input id="overtime_hours" type="number" placeholder="0" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Holiday hrs <span style="color:var(--text3);font-size:9px">(×1.7)</span></label>
          <input id="holiday_hours" type="number" placeholder="0" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- Per Diem -->
    <div class="section-card" style="animation-delay:0.25s">
      <div class="section-label"><span class="dot" style="background:#ec4899"></span>Per Diem</div>
      <div class="field-row">
        <div class="field">
          <label>Days</label>
          <input id="perdiem_days" type="number" placeholder="0" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Rate / day</label>
          <input id="perdiem_rate" type="number" placeholder="0.00" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- My Contact -->
    <div class="section-card" style="animation-delay:0.3s">
      <div class="section-label"><span class="dot"></span>My Contact</div>
      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input id="email" placeholder="sergio@sjprogrammers.com" type="email">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Phone</label>
          <input id="phone" placeholder="+52 (444) 000-0000" type="tel">
        </div>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="preview-card" style="margin-top:16px">
      <div class="preview-label">💰 Live Estimate</div>
      <div class="preview-grid">
        <div class="preview-row">
          <div class="preview-row-label"><span class="badge">R</span>Regular</div>
          <div class="preview-row-value" id="prev-regular">—</div>
        </div>
        <div class="preview-row">
          <div class="preview-row-label"><span class="badge">OT</span>Overtime</div>
          <div class="preview-row-value" id="prev-overtime">—</div>
        </div>
        <div class="preview-row">
          <div class="preview-row-label"><span class="badge">H</span>Holiday</div>
          <div class="preview-row-value" id="prev-holiday">—</div>
        </div>
        <div class="preview-row">
          <div class="preview-row-label"><span class="badge">PD</span>Per Diem</div>
          <div class="preview-row-value" id="prev-perdiem">—</div>
        </div>
      </div>
      <div class="preview-total">
        <div>
          <div class="preview-total-label">TOTAL</div>
          <div id="prev-tax-line" style="font-size:10px;color:var(--text3);margin-top:2px"></div>
        </div>
        <div class="preview-total-value" id="prev-total">$0</div>
      </div>
    </div>

    <!-- Generate Button -->
    <div class="generate-section">
      <button class="btn-generate" onclick="generatePDF()">
        <span>📄</span> Generate PDF
      </button>
    </div>

  </div>

  <!-- ══ PAGE: CLIENTS ══ -->
  <div id="page-clients" class="panel">
    <div class="page-header">
      <div class="page-title">Clients</div>
      <div class="page-count" id="clients-count">0 saved</div>
    </div>
    <div id="clients-list"></div>
    <div class="generate-section">
      <button class="btn-secondary" onclick="clearAllClients()">🗑️ Clear all clients</button>
    </div>
  </div>

  <!-- ══ PAGE: HISTORY ══ -->
  <div id="page-history" class="panel">
    <div class="page-header">
      <div class="page-title">History</div>
      <div class="page-count" id="history-count">0 quotes</div>
    </div>
    <div id="history-list"></div>
    <div class="generate-section">
      <button class="btn-secondary" onclick="clearHistory()">🗑️ Clear history</button>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-new" onclick="switchPage('new')">
    <span class="nav-icon">✏️</span>
    <span class="nav-label">New</span>
  </button>
  <button class="nav-item" id="nav-clients" onclick="switchPage('clients')">
    <span class="nav-icon">👥</span>
    <span class="nav-label">Clients</span>
  </button>
  <button class="nav-item" id="nav-history" onclick="switchPage('history')">
    <span class="nav-icon">📋</span>
    <span class="nav-label">History</span>
  </button>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function switchPage(page) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  if (page === 'clients') renderClients();
  if (page === 'history') renderHistory();
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function getLanguage(locale) { return locale.startsWith('es') ? 'es' : 'en'; }

function getCurrencyCode(locale) {
  return { 'es-MX': 'MXN', 'en-US': 'USD', 'en-CA': 'CAD' }[locale];
}

function formatMoney(amount, locale) {
  const currencyMap = { 'es-MX': 'MXN', 'en-US': 'USD', 'en-CA': 'CAD' };
  return new Intl.NumberFormat(locale, {
    style: 'currency',
    currency: currencyMap[locale],
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(amount || 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function n(id) { return parseFloat(document.getElementById(id).value) || 0; }
function v(id) { return document.getElementById(id).value.trim(); }

// ══════════════════════════════════════════
//  LIVE PREVIEW
// ══════════════════════════════════════════
function updatePreview() {
  const locale    = v('currency') || 'en-US';
  const rate      = n('rate');
  const rH        = n('regular_hours');
  const otH       = n('overtime_hours');
  const holH      = n('holiday_hours');
  const pdD       = n('perdiem_days');
  const pdR       = n('perdiem_rate');

  const regAmt    = rH * rate;
  const otAmt     = otH * rate * 1.5;
  const holAmt    = holH * rate * 1.7;
  const pdAmt     = pdD * pdR;
  const subtotal  = regAmt + otAmt + holAmt + pdAmt;
  const tax       = locale === 'es-MX' ? subtotal * 0.16 : 0;
  const total     = subtotal + tax;

  const fmt = (v) => v > 0 ? formatMoney(v, locale) : '—';

  document.getElementById('prev-regular').textContent   = fmt(regAmt);
  document.getElementById('prev-overtime').textContent  = fmt(otAmt);
  document.getElementById('prev-holiday').textContent   = fmt(holAmt);
  document.getElementById('prev-perdiem').textContent   = fmt(pdAmt);
  document.getElementById('prev-total').textContent     = total > 0 ? formatMoney(total, locale) : '$0';

  const taxLine = document.getElementById('prev-tax-line');
  if (locale === 'es-MX' && tax > 0) {
    taxLine.textContent = `Subtotal ${formatMoney(subtotal, locale)} + IVA ${formatMoney(tax, locale)}`;
  } else {
    taxLine.textContent = '';
  }
}

// ══════════════════════════════════════════
//  CLIENT MEMORY
// ══════════════════════════════════════════
function saveClient() {
  const name = v('client');
  if (!name) return;
  const data = {
    name,
    address  : v('address'),
    address2 : v('address2'),
    email    : v('clientEmail'),
    contact  : v('contactName'),
    currency : v('currency')
  };
  localStorage.setItem('sjp_client_' + name.toLowerCase(), JSON.stringify(data));
}

function loadClient(name) {
  if (!name) return;
  const raw = localStorage.getItem('sjp_client_' + name.toLowerCase());
  if (!raw) return;
  const data = JSON.parse(raw);
  document.getElementById('address').value     = data.address  || '';
  document.getElementById('address2').value    = data.address2 || '';
  document.getElementById('clientEmail').value = data.email    || '';
  document.getElementById('contactName').value = data.contact  || '';
  document.getElementById('currency').value    = data.currency || 'en-US';
  updatePreview();
}

function getAllClients() {
  const clients = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('sjp_client_')) {
      try { clients.push(JSON.parse(localStorage.getItem(key))); } catch(e) {}
    }
  }
  return clients.sort((a,b) => a.name.localeCompare(b.name));
}

function renderClients() {
  const list = document.getElementById('clients-list');
  const clients = getAllClients();
  document.getElementById('clients-count').textContent = clients.length + ' saved';

  if (clients.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">No clients saved yet.<br>Create a quote to auto-save.</div></div>`;
    return;
  }

  list.innerHTML = clients.map((c, i) => `
    <div class="client-item" style="animation-delay:${i * 0.05}s" onclick="loadClientAndSwitch('${c.name}')">
      <div>
        <div class="client-name">${c.name}</div>
        <div class="client-detail">${c.email || c.address || 'No details'}</div>
      </div>
      <div class="client-arrow">›</div>
    </div>
  `).join('');
}

function loadClientAndSwitch(name) {
  document.getElementById('client').value = name;
  loadClient(name);
  switchPage('new');
  showToast('Client loaded: ' + name);
}

function clearAllClients() {
  if (!confirm('Delete all saved clients?')) return;
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    if (localStorage.key(i).startsWith('sjp_client_')) keys.push(localStorage.key(i));
  }
  keys.forEach(k => localStorage.removeItem(k));
  renderClients();
  showToast('Clients cleared');
}

// ══════════════════════════════════════════
//  QUOTE HISTORY
// ══════════════════════════════════════════
function saveToHistory(data) {
  const history = JSON.parse(localStorage.getItem('sjp_history') || '[]');
  history.unshift({ ...data, savedAt: new Date().toISOString() });
  if (history.length > 50) history.pop();
  localStorage.setItem('sjp_history', JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('history-list');
  const history = JSON.parse(localStorage.getItem('sjp_history') || '[]');
  document.getElementById('history-count').textContent = history.length + ' quotes';

  if (history.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No quotes generated yet.<br>Go to New to create one.</div></div>`;
    return;
  }

  list.innerHTML = history.map((q, i) => `
    <div class="quote-item" style="animation-delay:${i * 0.04}s" onclick="reloadQuote(${i})">
      <div>
        <div class="quote-id">${q.quotationNo || '—'}</div>
        <div class="quote-meta">${q.client || 'No client'} · ${q.project || 'No project'}</div>
      </div>
      <div>
        <div class="quote-amount">${q.totalFormatted || '—'}</div>
        <div class="quote-date">${q.savedAt ? new Date(q.savedAt).toLocaleDateString() : ''}</div>
      </div>
    </div>
  `).join('');
}

function reloadQuote(index) {
  const history = JSON.parse(localStorage.getItem('sjp_history') || '[]');
  const q = history[index];
  if (!q) return;
  document.getElementById('quotationNo').value    = q.quotationNo || '';
  document.getElementById('client').value         = q.client      || '';
  document.getElementById('contactName').value    = q.contactName || '';
  document.getElementById('clientEmail').value    = q.clientEmail || '';
  document.getElementById('address').value        = q.address     || '';
  document.getElementById('address2').value       = q.address2    || '';
  document.getElementById('project').value        = q.project     || '';
  document.getElementById('currency').value       = q.currency    || 'en-US';
  document.getElementById('regular_hours').value  = q.regular_hours  || '';
  document.getElementById('overtime_hours').value = q.overtime_hours || '';
  document.getElementById('holiday_hours').value  = q.holiday_hours  || '';
  document.getElementById('rate').value           = q.rate           || '';
  document.getElementById('perdiem_days').value   = q.perdiem_days   || '';
  document.getElementById('perdiem_rate').value   = q.perdiem_rate   || '';
  document.getElementById('email').value          = q.email          || '';
  document.getElementById('phone').value          = q.phone          || '';
  updatePreview();
  switchPage('new');
  showToast('Quote loaded');
}

function clearHistory() {
  if (!confirm('Delete all quote history?')) return;
  localStorage.removeItem('sjp_history');
  renderHistory();
  showToast('History cleared');
}

// ══════════════════════════════════════════
//  CLEAR FORM
// ══════════════════════════════════════════
function clearForm() {
  if (!confirm('Clear the current form?')) return;
  ['quotationNo','client','contactName','clientEmail','address','address2',
   'project','regular_hours','overtime_hours','holiday_hours','rate',
   'perdiem_days','perdiem_rate','email','phone'].forEach(id => {
    document.getElementById(id).value = '';
  });
  updatePreview();
  showToast('Form cleared');
}

// ══════════════════════════════════════════
//  QUOTE ID GENERATOR
// ══════════════════════════════════════════
function generatePO() {
  const year = new Date().getFullYear();
  const last = parseInt(localStorage.getItem('sjp_last_quote') || '0') + 1;
  localStorage.setItem('sjp_last_quote', last);
  return year + '-' + String(last).padStart(3, '0');
}

// ══════════════════════════════════════════
//  TRANSLATIONS
// ══════════════════════════════════════════
const TEXT = {
  es: {
    quote: 'COTIZACIÓN',
    quotationId: 'Cotización #',
    date: 'Fecha',
    from: 'De',
    to: 'Para',
    project: 'Proyecto',
    subtotal: 'Subtotal',
    tax: 'IVA (16%)',
    total: 'Total',
    termsTitle: 'TÉRMINOS Y CONDICIONES',
    terms: [
      'Hospedaje no incluido.',
      'Casetas y gasolina no incluidos.',
      'Validez de cotización: 15 días naturales.',
      'Después de 40 horas semanales ×1.5.',
      'Días festivos ×1.7.',
      'Viajes > 3 horas desde SLP, México, requieren vuelo o auto rentado.'
    ],
    items: { regular: 'Horas Regulares', overtime: 'Horas Extra', holiday: 'Horas Festivas', perdiem: 'Viáticos (Diarios)' },
    table: ['Item','Descripción','Cantidad','Tarifa','Total']
  },
  en: {
    quote: 'QUOTE',
    quotationId: 'Quotation ID',
    date: 'Date',
    from: 'From',
    to: 'To',
    project: 'Project',
    subtotal: 'Subtotal',
    tax: 'Tax (16%)',
    total: 'Total',
    termsTitle: 'TERMS & CONDITIONS',
    terms: [
      'Hotel not included.',
      'Tolls and fuel not included.',
      'Quotation valid for 15 days.',
      'Overtime ×1.5 after 40 hours.',
      'Holidays ×1.7.',
      'Travel > 3 hours from SLP, México, requires flight or car rental.'
    ],
    items: { regular: 'Regular Hours', overtime: 'Overtime Hours', holiday: 'Holiday Hours', perdiem: 'Per Diem' },
    table: ['Item','Description','Qty','Rate','Total']
  }
};

// ══════════════════════════════════════════
//  GENERATE PDF
// ══════════════════════════════════════════
function generatePDF() {
  saveClient();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const locale       = v('currency') || 'en-US';
  const lang         = getLanguage(locale);
  const t            = TEXT[lang];
  const currencyCode = getCurrencyCode(locale);

  const Quotation_No = v('quotationNo') || generatePO();
  const creationDate = new Date().toLocaleDateString(locale);

  const client      = v('client');
  const address     = v('address');
  const address2    = v('address2');
  const project     = v('project');
  const contactName = v('contactName');
  const clientEmail = v('clientEmail');
  const email       = v('email');
  const phone       = v('phone');

  const regular_hours  = n('regular_hours');
  const overtime_hours = n('overtime_hours');
  const holiday_hours  = n('holiday_hours');
  const rate           = n('rate');
  const perdiem_days   = n('perdiem_days');
  const perdiem_rate   = n('perdiem_rate');

  const subtotal = (regular_hours * rate) + (overtime_hours * rate * 1.5) + (holiday_hours * rate * 1.7) + (perdiem_days * perdiem_rate);
  const tax      = locale === 'es-MX' ? subtotal * 0.16 : 0;
  const total    = subtotal + tax;

  // Save to history
  saveToHistory({
    quotationNo: Quotation_No, client, contactName, clientEmail,
    address, address2, project, currency: locale,
    regular_hours, overtime_hours, holiday_hours, rate,
    perdiem_days, perdiem_rate, email, phone,
    total, totalFormatted: formatMoney(total, locale)
  });

  // Save last quote number for auto-increment
  const parts = Quotation_No.split('-');
  if (parts.length === 2 && !isNaN(parts[1])) {
    localStorage.setItem('sjp_last_quote', parseInt(parts[1]));
  }

  // ── Core PDF build function (called with or without logo) ──
  function buildPDF(logoImg) {
    // Logo (optional)
    if (logoImg) {
      try { doc.addImage(logoImg, 'JPEG', 10, 10, 40, 40); } catch(e) {}
    } else {
      // Text placeholder when no logo
      doc.setFontSize(20);
      doc.setFont(undefined, 'bold');
      doc.text('SJP', 15, 35);
      doc.setFont(undefined, 'normal');
    }

    // Header right
    doc.setFontSize(18);
    doc.setFont(undefined, 'bold');
    doc.text(t.quote, 160, 20);
    doc.setFont(undefined, 'normal');
    doc.setFontSize(11);
    doc.text(t.quotationId + ': ' + Quotation_No, 140, 28);
    doc.text(t.date + ': ' + creationDate, 140, 34);

    // Divider line after header
    doc.setDrawColor(200);
    doc.line(15, 55, 195, 55);

    // FROM
    doc.setFontSize(10);
    doc.setFont(undefined, 'bold');
    doc.text(t.from + ':', 15, 63);
    doc.setFont(undefined, 'normal');
    let fromY = 70;
    doc.text('Sergio Jordan', 15, fromY); fromY += 6;
    doc.text('San Luis Potosí, México', 15, fromY); fromY += 6;
    if (email) { doc.text(email, 15, fromY); fromY += 6; }
    if (phone) { doc.text(phone, 15, fromY); }

    // TO
    doc.setFont(undefined, 'bold');
    doc.text(t.to + ':', 105, 63);
    doc.setFont(undefined, 'normal');
    let toY = 70;
    if (client)      { doc.text(client,      105, toY); toY += 6; }
    if (contactName) { doc.text(contactName, 105, toY); toY += 6; }
    if (clientEmail) { doc.text(clientEmail, 105, toY); toY += 6; }
    if (address)     { doc.text(address,     105, toY); toY += 6; }
    if (address2)    { doc.text(address2,    105, toY); }

    // Project
    doc.setFont(undefined, 'bold');
    doc.text(t.project + ': ', 15, 102);
    doc.setFont(undefined, 'normal');
    doc.text(project || '—', 15 + doc.getTextWidth(t.project + ': '), 102);

    // Items table
    doc.autoTable({
      startY: 110,
      head: [t.table],
      body: [
        ['1', t.items.regular,  regular_hours,  formatMoney(rate,         locale), formatMoney(regular_hours  * rate,        locale)],
        ['2', t.items.overtime, overtime_hours, formatMoney(rate * 1.5,   locale), formatMoney(overtime_hours * rate * 1.5,  locale)],
        ['3', t.items.holiday,  holiday_hours,  formatMoney(rate * 1.7,   locale), formatMoney(holiday_hours  * rate * 1.7,  locale)],
        ['4', t.items.perdiem,  perdiem_days,   formatMoney(perdiem_rate,  locale), formatMoney(perdiem_days   * perdiem_rate, locale)]
      ],
      styles: { fontSize: 10 },
      headStyles: { fillColor: [30, 30, 50] },
      columnStyles: { 0: { cellWidth: 12 }, 1: { cellWidth: 60 } }
    });

    // Totals box
    const boxX = 120;
    const boxY = doc.lastAutoTable.finalY + 12;

    doc.setFillColor(245, 245, 245);
    doc.roundedRect(boxX, boxY, 75, locale === 'es-MX' ? 38 : 28, 3, 3, 'FD');
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text(t.subtotal, boxX + 5, boxY + 10);
    doc.text(formatMoney(subtotal, locale), boxX + 70, boxY + 10, { align: 'right' });

    if (locale === 'es-MX') {
      doc.text(t.tax, boxX + 5, boxY + 20);
      doc.text(formatMoney(tax, locale), boxX + 70, boxY + 20, { align: 'right' });
      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);
      doc.text(t.total, boxX + 5, boxY + 33);
      doc.text(formatMoney(total, locale) + ' ' + currencyCode, boxX + 70, boxY + 33, { align: 'right' });
    } else {
      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);
      doc.text(t.total, boxX + 5, boxY + 23);
      doc.text(formatMoney(total, locale) + ' ' + currencyCode, boxX + 70, boxY + 23, { align: 'right' });
    }

    // Terms
    const termsY = boxY + (locale === 'es-MX' ? 48 : 38);
    doc.setDrawColor(200);
    doc.line(15, termsY, 195, termsY);
    doc.setFontSize(10);
    doc.setFont(undefined, 'bold');
    doc.text(t.termsTitle, 15, termsY + 10);
    doc.setFont(undefined, 'normal');
    let ty = termsY + 18;
    t.terms.forEach(line => { doc.text('• ' + line, 15, ty); ty += 6; });

    doc.save(Quotation_No + '.pdf');
    showToast('✅ PDF: ' + Quotation_No);
  }

  // Try loading logo; build PDF either way
  const logo = new Image();
  logo.crossOrigin = 'anonymous';
  logo.onload  = () => buildPDF(logo);
  logo.onerror = () => buildPDF(null);
  // Kick off — if no logo file exists, onerror fires and we still build
  logo.src = 'logo.jpg';
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
updatePreview();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.log('SW error:', e));
  });
}
</script>
</body>
